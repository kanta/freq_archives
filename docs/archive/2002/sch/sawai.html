一見すると均質にも思われるディジタルデータからアナログ（音）への変換ですが、そこにはソフトウェアのアルゴリズムやハードウェアの回路設計などによって大きな違いが存在しています。実際の音楽製作に用いられるさまざまなソフトウェア/ハードウェアの間の音質の違い、さらにはモニタスピーカの音の違いまでを体験できるレクチャー。<br />
